<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>mac-sysmon — macOS System Resource & Process Monitor</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="apple-dark">
  <div class="app-root">
    <!-- Top Navigation Bar -->
    <div id="navbar-container"></div>

    <!-- Main Content Area -->
    <main class="app-main-content">
      <div class="tab-content" id="tab-overview" style="display: block;"></div>
      <div class="tab-content" id="tab-cpu" style="display: none;"></div>
      <div class="tab-content" id="tab-memory" style="display: none;"></div>
      <div class="tab-content" id="tab-disks" style="display: none;"></div>
      <div class="tab-content" id="tab-processes" style="display: none;"></div>
    </main>

    <!-- Bottom Status Bar -->
    <footer class="app-footer">
      <div class="footer-left">
        <span class="footer-hint">Tip: Use <strong>⌘1</strong> to <strong>⌘5</strong> to switch views • <strong>⌘F</strong> to search processes</span>
      </div>
      <div class="footer-right">
        <span>mac-sysmon v0.1.0 • Built with Rust & Vanilla TypeScript</span>
      </div>
    </footer>
  </div>

  <script type="module" src="bundle.js"></script>
</body>
</html>
